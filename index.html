<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Race Car Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,900&amp;family=Barlow:wght@400;600&amp;display=swap">
  <style>
    :root {
      --red: #e10600; --white: #f4f4f4; --bg: #0a0a0b; --row: #17171a;
      --card: #151518; --line: #3a3a40; --muted: #8e8e96; --text: #b4b4bc;
      --green: #35c759;
      --cond: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
      --body: Barlow, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #fff;
      font: 16px/1.35 var(--body); overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #stage { position: relative; flex: none; margin: 0 auto; width: 100vw; background: #000; }
    #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
    #overlay { touch-action: none; }
    .live { position: absolute; left: 8px; top: 8px; padding: 4px 7px;
      background: var(--red); font: 800 12px/1 var(--cond); letter-spacing: 0.14em;
      pointer-events: none; }
    body.running .live { display: none; }

    /* Buttons: a slanted red primary, an outlined secondary, a text link. */
    button { font: 900 italic 20px/1 var(--cond); letter-spacing: 0.06em;
      text-transform: uppercase; color: #fff; background: var(--red); border: 0;
      min-height: 50px; padding: 0 22px; cursor: pointer;
      clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
    button:disabled { background: #2a2a2e; color: #6e6e76; cursor: default; }
    button.quiet { clip-path: none; background: transparent; border: 1px solid var(--line);
      font: 700 15px/1 var(--cond); letter-spacing: 0.08em; min-height: 44px; }
    button.quiet:disabled { color: #55555c; border-color: #26262a; }
    button.link { clip-path: none; background: none; min-height: 44px; padding: 0 6px;
      font: 600 14px/1 var(--cond); letter-spacing: 0.1em; color: var(--muted); }
    button.link:disabled { color: #44444a; background: none; }
    button.wide { width: 100%; }
    button.big { min-height: 60px; font-size: 26px; }

    /* Setup: header, camera, step panel. */
    #setup-head { flex: none; }
    .chk { height: 10px; background:
      repeating-conic-gradient(var(--white) 0 25%, var(--bg) 0 50%) 0 0 / 10px 10px; }
    .head { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px; }
    .head-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .lap { display: flex; align-items: center; gap: 10px; }
    .tag { padding: 4px 10px 4px 8px; background: var(--red); transform: skewX(-12deg);
      font: 900 italic 13px/1 var(--cond); letter-spacing: 0.06em;
      text-transform: uppercase; }
    .sub { font: 600 13px/1 var(--cond); letter-spacing: 0.14em; color: var(--muted);
      text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    h1 { margin: 0; font: 900 italic 28px/1 var(--cond); text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #hero { flex: none; width: 132px; height: 52px; }

    #setup { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 20px;
      display: flex; flex-direction: column; gap: 10px; }
    .step { display: flex; flex-direction: column; gap: 10px; }
    #hint { margin: 0; color: var(--text); font-size: 15px; }
    #hint:empty { display: none; }
    .links { display: flex; justify-content: space-between; }
    .status { margin: auto 0 0; font-size: 12px; color: #66666e; }
    .status:empty { display: none; }

    /* Cars as a timing tower. */
    .tower { list-style: none; margin: 0; padding: 0; display: flex;
      flex-direction: column; gap: 2px; }
    .tower li { display: flex; align-items: center; gap: 10px; min-height: 44px;
      background: var(--row); padding-right: 6px; }
    .pos { width: 34px; align-self: stretch; display: grid; place-items: center;
      background: var(--white); color: var(--bg); font: 900 italic 20px/1 var(--cond); }
    .note { width: 6px; align-self: stretch; margin-left: -10px; }
    .name { flex: 1; min-width: 0; font: 800 18px/1 var(--cond); letter-spacing: 0.04em;
      text-transform: uppercase; color: #fff; }
    input.name { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line);
      padding: 6px 0; }
    .bar { position: relative; flex: none; width: 64px; height: 8px; background: #2e2e33; }
    .bar::after { content: ""; position: absolute; left: 50%; top: -3px; width: 2px;
      height: 14px; background: #fff; }
    .fill { height: 100%; width: 0; background: #66666e; }
    .fill.on { background: var(--green); }
    .tower button.remove { min-height: 40px; width: 40px; padding: 0; clip-path: none;
      background: none; color: var(--muted); font: 600 22px/1 var(--body); }

    /* Mode cards. */
    .mode { position: relative; overflow: hidden; background: var(--card);
      border: 2px solid transparent; }
    .mode.on { border-color: var(--red); }
    .mode.on::after { content: ""; position: absolute; right: -10px; top: 0; bottom: 0;
      width: 56px; pointer-events: none;
      background: repeating-linear-gradient(115deg, transparent 0 8px, rgb(225 6 0 / 0.9) 8px 14px); }
    .mode > button { display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      width: 100%; padding: 14px 70px 14px 14px; clip-path: none; background: none;
      text-align: left; min-height: 0; }
    .mode-title { font: 900 italic 30px/0.95 var(--cond); }
    .mode-text { font: 400 13px/1.4 var(--body); letter-spacing: 0; text-transform: none;
      color: var(--muted); }
    .laps { display: flex; align-items: center; gap: 12px; padding: 0 14px 14px; }
    .laps label { font: 600 14px/1 var(--cond); letter-spacing: 0.14em; text-transform: uppercase; }
    .stepper { display: flex; border: 1px solid var(--line); }
    .stepper button { clip-path: none; min-height: 44px; width: 44px; padding: 0;
      background: #1e1e22; font: 600 22px/1 var(--body); }
    .stepper input { width: 56px; border: 0; background: transparent; color: #fff;
      text-align: center; font: 900 italic 24px/1 var(--cond); -moz-appearance: textfield; }
    .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* Ready. */
    #summary { margin: 0; font: 600 13px/1.3 var(--cond); letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); }
    .lights { display: flex; justify-content: center; gap: 8px; padding: 4px 0; }
    .lights i { width: 24px; height: 24px; border-radius: 50%; background: #2a0605;
      border: 3px solid #1a1a1d; }
    #settings { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px;
      background: var(--card); }
    #settings .row, .tune { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .tune { padding: 0 12px; background: var(--card); }
    #settings label, .tune label { flex: none; width: 9.5em; font: 600 15px/1.1 var(--cond);
      letter-spacing: 0.06em; text-transform: uppercase; }
    #settings input, .tune input { flex: 1; min-width: 0; accent-color: var(--red); }
    #settings span, .tune span { width: 3.5em; text-align: right; font: 800 16px/1 var(--cond); }

    /* Practice and Race: the results sit at the bottom, over the part of the
       picture that shows only what the phone stands on. */
    .run-chk { position: fixed; left: 0; right: 0; top: 0; }
    #run { position: fixed; left: 0; right: 0; bottom: 0; max-height: 75dvh; overflow-y: auto;
      padding: 12px 14px 18px; background: rgb(10 10 11 / 0.92);
      display: flex; flex-direction: column; gap: 10px; }
    .run-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .clock { font: 800 24px/1 var(--cond); font-variant-numeric: tabular-nums; }
    .label { font: 600 12px/1 var(--cond); letter-spacing: 0.12em; color: var(--muted);
      text-transform: uppercase; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .cards.single { grid-template-columns: minmax(0, 1fr); }
    .card { background: var(--row); min-width: 0; }
    .card-stripe { height: 6px; }
    .card-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 0; }
    .card-pos { width: 24px; height: 24px; flex: none; display: grid; place-items: center;
      background: var(--white); color: var(--bg); font: 900 italic 16px/1 var(--cond); }
    .card-name { min-width: 0; font: 800 17px/1 var(--cond); text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-last { padding: 6px 10px 0; font: 900 italic 34px/1 var(--cond);
      font-variant-numeric: tabular-nums; }
    .card-stats { display: flex; justify-content: space-between; gap: 6px; padding: 6px 10px 10px; }
    .stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .stat:last-child { align-items: flex-end; }
    .stat b { font: 700 16px/1 var(--cond); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .fastest { color: #c77dff; }
    .run-buttons { display: flex; gap: 8px; }
    .run-buttons button:not(.quiet) { flex: 1; }

    .result-head { display: flex; align-items: stretch; margin: -12px -14px 0; }
    .finish-box { display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      min-width: 130px; padding: 10px 24px 10px 14px;
      background: repeating-conic-gradient(var(--white) 0 25%, var(--bg) 0 50%) 0 0 / 14px 14px;
      clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
    .finish-box span { background: var(--bg); padding: 3px 6px; }
    #finish-label { font: 700 12px/1 var(--cond); letter-spacing: 0.16em; text-transform: uppercase; }
    #finish-laps { font: 900 italic 38px/0.95 var(--cond); font-variant-numeric: tabular-nums; }
    .result-time { flex: 1; display: flex; flex-direction: column; align-items: flex-end;
      justify-content: center; gap: 4px; padding: 10px 14px; }
    .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;
      align-items: end; }
    .podium-step { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .podium-name { display: flex; align-items: center; gap: 6px; max-width: 100%;
      font: 800 16px/1 var(--cond); text-transform: uppercase; }
    .podium-name span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .podium-block { width: 100%; display: flex; justify-content: center; padding-top: 8px;
      background: var(--white); color: var(--bg); font: 900 italic 28px/1 var(--cond); }
    .podium-block.p1 { height: 80px; background: var(--red); color: #fff; }
    .podium-block.p2 { height: 56px; }
    .podium-block.p3 { height: 40px; }
    .others { list-style: none; margin: 0; padding: 0; }
    .others li { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      background: var(--row); font: 800 16px/1 var(--cond); text-transform: uppercase; }
    .others li b { margin-left: auto; font-weight: 700; }

    #countdown { position: fixed; inset: 0; display: grid; place-items: center;
      font: 900 italic 40vw/1 var(--cond); pointer-events: none;
      text-shadow: 0 0 20px #000; }
    #message { position: fixed; inset: 0; z-index: 10; display: grid;
      place-content: center; gap: 16px; padding: 24px; text-align: center;
      background: var(--bg); }
  </style>
</head>
<body>
  <header id="setup-head">
    <div class="chk"></div>
    <div class="head">
      <div class="head-text">
        <div class="lap"><span id="step-tag" class="tag"></span><span id="step-sub" class="sub"></span></div>
        <h1 id="step-title"></h1>
      </div>
      <svg id="hero" viewBox="0 0 200 76" role="img" aria-label="Race car" hidden>
        <g fill="rgb(225 6 0 / 0.55)">
          <rect x="0" y="30" width="60" height="2"></rect><rect x="10" y="38" width="44" height="2"></rect>
          <rect x="0" y="46" width="52" height="2"></rect>
        </g>
        <rect x="58" y="20" width="18" height="5" fill="#e10600"></rect>
        <rect x="65" y="25" width="4" height="13" fill="#cfcfd4"></rect>
        <path d="M60 50 L80 42 L110 39 L126 28 L152 28 L160 37 L182 39 L198 46 L198 52 L60 52 Z" fill="#e10600"></path>
        <path d="M110 39 L126 28 L152 28 L160 37 Z" fill="#f4f4f4"></path>
        <circle cx="140" cy="26" r="6" fill="#f2c230"></circle>
        <circle cx="92" cy="54" r="12" fill="#1a1a1d"></circle><circle cx="92" cy="54" r="4.5" fill="#8e8e96"></circle>
        <circle cx="178" cy="54" r="12" fill="#1a1a1d"></circle><circle cx="178" cy="54" r="4.5" fill="#8e8e96"></circle>
      </svg>
    </div>
  </header>

  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <span class="live">● LIVE</span>
  </div>

  <div id="message" hidden>
    <p id="message-text"></p>
    <button id="retry">Retry</button>
  </div>

  <section id="setup">
    <p id="hint" aria-live="polite"></p>

    <div class="step" data-step="zone">
      <div id="zoom-row" class="tune" hidden>
        <label for="zoom">Zoom</label>
        <input id="zoom" type="range">
        <span id="zoom-value"></span>
      </div>
      <button id="zone-next" class="wide">Next</button>
    </div>

    <div class="step" data-step="baseline">
      <button id="capture-baseline" class="wide">Capture empty track</button>
      <div class="links">
        <button id="baseline-back" class="link">‹ Back</button>
        <button id="baseline-next" class="link">Keep it ›</button>
      </div>
    </div>

    <div class="step" data-step="cars">
      <ul id="cars" class="tower"></ul>
      <button id="add-car" class="wide">Add car</button>
      <button id="tap-note" class="quiet wide" hidden>Camera missed it? Tap the sticker</button>
      <div class="links">
        <button id="cars-back" class="link">‹ Back</button>
        <button id="cars-done" class="link">Done with cars ›</button>
      </div>
    </div>

    <div class="step" data-step="mode">
      <div id="mode-practice" class="mode">
        <button data-mode="practice" aria-pressed="false">
          <span class="mode-title">Practice</span>
          <span class="mode-text">The clock starts on the first crossing. No lap limit.</span>
        </button>
      </div>
      <div id="mode-race" class="mode">
        <button data-mode="race" aria-pressed="false">
          <span class="mode-title">Race</span>
          <span class="mode-text">Grid start behind the line. Lights, then go.</span>
        </button>
        <div class="laps">
          <div class="stepper">
            <button id="laps-down" aria-label="Fewer laps">−</button>
            <input id="lap-target" type="number" min="1" max="999" inputmode="numeric" aria-label="Laps">
            <button id="laps-up" aria-label="More laps">+</button>
          </div>
          <label for="lap-target">Laps</label>
        </div>
      </div>
      <button id="mode-next" class="wide">Next</button>
      <div class="links"><button id="mode-back" class="link">‹ Back</button></div>
    </div>

    <div class="step" data-step="ready">
      <ul id="grid" class="tower"></ul>
      <p id="summary"></p>
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <button id="start" class="wide big">Lights out</button>
      <div class="links">
        <button id="edit-setup" class="link">Edit setup</button>
        <button id="settings-toggle" class="link" aria-expanded="false" aria-controls="settings">Settings</button>
        <button id="clear-setup" class="link">Clear</button>
      </div>
      <div id="settings" hidden>
        <div class="row">
          <label for="tolerance">Colour tolerance</label>
          <input id="tolerance" type="range" min="5" max="40" step="1">
          <span id="tolerance-value"></span>
        </div>
        <div class="row">
          <label for="min-lap">Minimum lap</label>
          <input id="min-lap" type="range" min="0.5" max="10" step="0.5">
          <span id="min-lap-value"></span>
        </div>
      </div>
    </div>

    <button id="install" class="quiet wide" hidden>Install as app</button>
    <p id="status" class="status"></p>
  </section>

  <div class="chk run-chk" hidden></div>
  <section id="run" hidden>
    <div id="live-view">
      <div class="run-bar"><span id="run-tag" class="tag"></span><span id="run-clock" class="clock"></span></div>
    </div>
    <div id="cards" class="cards"></div>
    <div id="result" hidden>
      <div class="result-head">
        <div class="finish-box"><span id="finish-label"></span><span id="finish-laps"></span></div>
        <div class="result-time"><span class="label">Race time</span><span id="result-time" class="clock"></span></div>
      </div>
    </div>
    <div id="podium" class="podium" hidden></div>
    <ol id="others" class="others" hidden></ol>
    <p id="run-status" class="status"></p>
    <div class="run-buttons">
      <button id="start-race">Start race</button>
      <button id="stop-race">Stop</button>
      <button id="reset">Reset</button>
      <button id="back" class="quiet">Setup</button>
    </div>
  </section>

  <div id="countdown" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
