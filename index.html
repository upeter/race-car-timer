<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Race Car Timer</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font: 16px/1.3 system-ui, sans-serif; overflow: hidden; }
    #stage { position: relative; margin: 0 auto; width: 100vw; }
    #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
    #overlay { touch-action: none; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 50dvh;
      overflow-y: auto; padding: 10px 12px; background: rgb(0 0 0 / 0.7); }
    #run { top: 0; bottom: auto; max-height: none; background: rgb(0 0 0 / 0.55); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
    button { font: inherit; padding: 10px 14px; border: 0; border-radius: 8px;
      background: #2f6fed; color: #fff; }
    button:disabled { background: #555; color: #999; }
    button.quiet { background: #444; }
    input[type="number"] { font: inherit; width: 4.5em; padding: 6px; }
    .status { margin: 0 0 4px; font-size: 13px; opacity: 0.8; }
    .status:empty { display: none; }
    #hint { margin: 0 0 4px; font-weight: 600; }
    #cars { list-style: none; margin: 0; padding: 0; }
    #cars li { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    #cars input { font: inherit; width: 7em; padding: 6px; }
    .swatch { display: inline-block; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #fff; flex: none; }
    .bar { position: relative; flex: 1; height: 14px; border-radius: 7px;
      background: #333; overflow: hidden; }
    .bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
      width: 2px; background: #fff; }
    .fill { height: 100%; width: 0; background: #888; }
    .fill.on { background: #35c759; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 4px 6px; text-align: right; white-space: nowrap; }
    th:nth-child(2), td:nth-child(2) { text-align: left; }
    th { font-size: 12px; font-weight: 600; opacity: 0.8; }
    td { font-size: 18px; }
    #countdown { position: fixed; inset: 0; display: grid; place-items: center;
      font-size: 40vw; font-weight: 800; pointer-events: none;
      text-shadow: 0 0 20px #000; }
    #message { position: fixed; inset: 0; z-index: 10; display: grid;
      place-content: center; gap: 16px; padding: 24px; text-align: center;
      background: #000; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="message" hidden>
    <p id="message-text"></p>
    <button id="retry">Retry</button>
  </div>

  <section id="setup" class="panel">
    <p id="hint"></p>
    <p id="status" class="status"></p>
    <div class="row">
      <button id="set-zone">1. Set zone</button>
      <button id="capture-baseline">2. Capture empty track</button>
    </div>
    <div class="row">
      <button id="add-car">3. Add car</button>
      <button id="tap-note" class="quiet">Tap note instead</button>
    </div>
    <ul id="cars"></ul>
    <div class="row">
      <label><input type="radio" name="mode" value="practice"> Practice</label>
      <label><input type="radio" name="mode" value="race"> Race</label>
      <label>Laps <input id="lap-target" type="number" min="1" max="999"></label>
    </div>
    <details>
      <summary>Settings</summary>
      <div class="row">
        <label for="tolerance">Colour tolerance</label>
        <input id="tolerance" type="range" min="5" max="40" step="1">
        <span id="tolerance-value"></span>
      </div>
      <div class="row">
        <label for="min-lap">Minimum lap time</label>
        <input id="min-lap" type="range" min="0.5" max="10" step="0.5">
        <span id="min-lap-value"></span>
      </div>
    </details>
    <div class="row">
      <button id="start">Start</button>
      <button id="clear-setup" class="quiet">Clear setup</button>
    </div>
  </section>

  <section id="run" class="panel" hidden>
    <p id="run-status" class="status"></p>
    <table>
      <thead>
        <tr><th>#</th><th>Car</th><th>Laps</th><th>Last</th><th>Best</th><th>Total</th></tr>
      </thead>
      <tbody id="standings"></tbody>
    </table>
    <div class="row">
      <button id="start-race">Start race</button>
      <button id="stop-race">Stop</button>
      <button id="reset">Reset</button>
      <button id="back" class="quiet">Setup</button>
    </div>
  </section>

  <div id="countdown" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
